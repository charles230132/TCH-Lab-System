name: 驗證固定版本採檢資料

on:
  push:
    paths: ['data/**', 'app.py', 'manual_search.py', 'tests/**', 'requirements.txt']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
